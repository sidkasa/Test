<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FocusFlow App</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <header>
        <h1>FocusFlow</h1>
        <p>A lightweight app for tracking daily tasks.</p>
      </header>

      <section class="task-entry" aria-label="Add task">
        <input id="taskInput" type="text" maxlength="100" placeholder="What do you need to do?" />
        <button id="addTaskButton" type="button">Add</button>
      </section>

      <section class="tabs" aria-label="Task categories">
        <button id="tab-active" class="tab-button is-active" type="button" data-tab="active">Your Tasks</button>
        <button id="tab-completed" class="tab-button" type="button" data-tab="completed">Completed Tasks</button>
        <button id="tab-deleted" class="tab-button" type="button" data-tab="deleted">Deleted Tasks</button>
      </section>

      <section class="task-list-wrapper" aria-label="Task list">
        <h2 id="tabTitle">Your Tasks</h2>
        <ul id="taskList" data-tab="active"></ul>
        <p id="emptyState">No tasks in this tab yet.</p>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
